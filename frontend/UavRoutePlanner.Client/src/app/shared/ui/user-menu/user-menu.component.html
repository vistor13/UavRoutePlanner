<div class="menu">
  <button type="button" class="trigger" aria-haspopup="menu" [attr.aria-expanded]="open()" (click)="toggle()">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="name">{{ userName() ?? 'Account' }}</span>
    <svg class="chevron" [class.up]="open()" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  @if (open()) {
    <div class="dropdown" role="menu">
      <div class="who">
        <span class="avatar large" aria-hidden="true">{{ initials() }}</span>
        <div>
          <strong>{{ userName() }}</strong>
          <span>Signed in</span>
        </div>
      </div>
      <button type="button" role="menuitem" class="item" (click)="openChangePassword()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        Change password
      </button>
      <button type="button" role="menuitem" class="item danger" (click)="signOut()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4M16 8l4 4-4 4M20 12H9"/></svg>
        Sign out
      </button>
    </div>
  }
</div>

@if (changing()) {
  <app-change-password (closed)="changing.set(false)" />
}
