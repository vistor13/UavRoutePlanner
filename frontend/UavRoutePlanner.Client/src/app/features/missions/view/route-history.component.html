<section class="card">
  <h2>History <span class="count">({{ routes().length }})</span></h2>

  @if (routes().length === 0) {
    <p class="empty">No routes built yet.</p>
  } @else {
    <ul>
      @for (route of visible(); track route.id) {
        <li>
          <button type="button" class="row" [class.selected]="route.id === selectedId()" (click)="picked.emit(route)">
            <span class="date">{{ route.createdAt | date: 'dd.MM.yyyy HH:mm' }}</span>
            <span class="wind">{{ wind(route) }}</span>
            <span class="ratio">{{ route.visitedObjectsCount }}/{{ route.totalObjectsCount }}</span>
            @if (complete(route)) {
              <svg class="state ok" viewBox="0 0 20 20" width="18" height="18" aria-label="All objects visited"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 10.3l2.8 2.8 5.2-5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            } @else {
              <svg class="state warn" viewBox="0 0 20 20" width="18" height="18" aria-label="Some objects skipped"><path d="M10 2.8L18 17H2L10 2.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8v4M10 14.2v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            }
          </button>
        </li>
      }
    </ul>

    @if (canExpand()) {
      <button type="button" class="more" (click)="toggle()">{{ expanded() ? 'Show less' : 'Show all history' }}</button>
    }
  }
</section>
